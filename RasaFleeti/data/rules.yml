version: "3.1"

rules:
- rule: list available reports
  steps:
  - intent: request_report_list
  - action: utter_list_reports

- rule: prompt report type when provide_report_detail without form
  condition:
  - active_loop: null
  steps:
  - intent: provide_report_detail
  - action: action_prompt_report_type

- rule: prompt report type when vehicle provided without form
  condition:
  - active_loop: null
  steps:
  - intent: provide_report_detail
    entities:
    - asset
  - action: action_prompt_report_type

- rule: prompt report type when date provided without form
  condition:
  - active_loop: null
  steps:
  - intent: provide_report_detail
    entities:
    - date
  - action: action_prompt_report_type

- rule: start report form
  steps:
  - intent: request_trips_report
  - action: report_form
  - active_loop: report_form

- rule: start fleet summary report form
  steps:
  - intent: request_fleet_summary_report
  - action: report_form
  - active_loop: report_form

- rule: start fleet performance report form
  steps:
  - intent: request_fleet_performance_summary_report
  - action: report_form
  - active_loop: report_form

- rule: start fuel consumption report form
  steps:
  - intent: request_fuel_consumption_report
  - action: report_form
  - active_loop: report_form

- rule: start odometer report form
  steps:
  - intent: request_odometer_report
  - action: report_form
  - active_loop: report_form

- rule: start idle time report form
  steps:
  - intent: request_idle_time_report
  - action: report_form
  - active_loop: report_form

- rule: start stop time report form
  steps:
  - intent: request_stop_time_report
  - action: report_form
  - active_loop: report_form

- rule: start utilization report form
  steps:
  - intent: request_utilization_report
  - action: report_form
  - active_loop: report_form

- rule: start driver behavior report form
  steps:
  - intent: request_driver_behavior_report
  - action: report_form
  - active_loop: report_form

- rule: start raw data report form
  steps:
  - intent: request_raw_data_report
  - action: report_form
  - active_loop: report_form

- rule: start track data report form
  steps:
  - intent: request_track_data_report
  - action: report_form
  - active_loop: report_form

- rule: start over speeding report form
  steps:
  - intent: request_over_speeding_report
  - action: report_form
  - active_loop: report_form

- rule: start temperature humidity report form
  steps:
  - intent: request_temperature_humidity_report
  - action: report_form
  - active_loop: report_form

- rule: start weight sensor report form
  steps:
  - intent: request_weight_sensor_report
  - action: report_form
  - active_loop: report_form

- rule: start commands history report form
  steps:
  - intent: request_commands_history_report
  - action: report_form
  - active_loop: report_form

- rule: start events report form
  steps:
  - intent: request_events_report
  - action: report_form
  - active_loop: report_form

- rule: submit report form
  condition:
  - active_loop: report_form
  steps:
  - action: report_form
  - active_loop: null
  - action: action_run_report

- rule: greet user
  condition:
  - active_loop: null
  steps:
  - intent: greet
  - action: utter_greet

- rule: greet user and deactivate form
  condition:
  - active_loop: report_form
  steps:
  - intent: greet
  - action: utter_greet
  - active_loop: null

- rule: reset on goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: bot challenge
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: handle textual fleet query
  steps:
  - intent: request_fleet_info
  - action: action_handle_textual_fleet

- rule: handle textual fleet query and exit form
  condition:
  - active_loop: report_form
  steps:
  - intent: request_fleet_info
  - active_loop: null
  - action: action_handle_textual_fleet

- rule: out of scope
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope

- rule: check for asset or date without report type (catch-all fallback)
  condition:
  - active_loop: null
  steps:
  - action: action_prompt_report_type
