version: "3.1"

intents:
  - greet
  - goodbye
  - bot_challenge
  - request_report_list
  - request_trips_report
  - request_idle_time_report
  - request_stop_time_report
  - provide_report_detail
  - request_fleet_summary_report
  - request_fleet_performance_summary_report
  - request_fuel_consumption_report
  - request_odometer_report
  - request_utilization_report
  - request_raw_data_report
  - request_track_data_report
  - request_over_speeding_report
  - request_temperature_humidity_report
  - request_weight_sensor_report
  - request_driver_behavior_report
  - request_commands_history_report
  - request_events_report
  - request_fleet_info
  - out_of_scope

entities:
  - report_type
  - asset
  - date
  - driver

slots:
  report_type:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: report_type
      - type: from_text
        conditions:
          - active_loop: report_form
            requested_slot: report_type
  
  driver:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: driver
  assets:
    type: any
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: report_form
            requested_slot: assets
      - type: from_entity
        entity: asset
        conditions:
          - active_loop: report_form
            requested_slot: assets
  assets_display:
    type: any
    influence_conversation: false
    mappings:
      - type: custom
  date_range:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: report_form
            requested_slot: date_range
  start_date:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  end_date:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  confirmed_assets:
    type: any
    influence_conversation: false
    mappings:
      - type: custom
  confirmed_assets_display:
    type: any
    influence_conversation: false
    mappings:
      - type: custom

responses:
  utter_greet:
  - text: "Hello! I can help you run fleet reports."

  utter_goodbye:
  - text: "Bye!"

  utter_iamabot:
  - text: "I am a bot powered by Rasa."

  utter_out_of_scope:
  - text: "I'm focused on fleet management. Please ask me questions related to fleet reports, and fleet information. For example:\n• Ask for a report: 'trips report for vehicle 390'\n• Ask about fleet info: 'what is the location of vehicle 390?'"

  utter_list_reports:
  - text: "Here are the reports you can run:\n\n1. **Trips Report / Fleet Statistics Report** - Trip statistics and fleet data\n2. **Fleet Summary Report** - Overview of fleet performance\n3. **Fleet Performance Summary Report** - Detailed performance metrics\n4. **Fuel Trip Consumption Report** - Fuel usage and consumption data\n5. **Odometer Report** - Vehicle mileage and distance tracking\n6. **Utilization Report / Work Hour Report** - Vehicle utilization and work hours\n7. **Stop Time Report** - Vehicle stoppage duration and times\n8. **Idle Time Report** - Idling duration and statistics\n9. **Raw Data Report** - Raw vehicle data\n10. **Track Data Report / All Parameters** - Complete tracking parameters\n11. **Over Speeding Report** - Speed violations and incidents\n12. **Driver Behavior Report** - Driver performance and behavior analysis\n13. **Temperature & Humidity Report** - Environmental sensor data\n14. **Weight Sensor Report** - Weight sensor readings\n15. **Commands History Report** - Command execution history\n16. **Events Report** - Vehicle events and incidents\n\nJust tell me which report you need, along with the vehicle plate number(s) and date range!"

  utter_ask_report_form_report_type:
  - text: "Here are the reports you can run:\n\n1. **Trips Report / Fleet Statistics Report** - Trip statistics and fleet data\n2. **Fleet Summary Report** - Overview of fleet performance\n3. **Fleet Performance Summary Report** - Detailed performance metrics\n4. **Fuel Trip Consumption Report** - Fuel usage and consumption data\n5. **Odometer Report** - Vehicle mileage and distance tracking\n6. **Utilization Report / Work Hour Report** - Vehicle utilization and work hours\n7. **Stop Time Report** - Vehicle stoppage duration and times\n8. **Idle Time Report** - Idling duration and statistics\n9. **Raw Data Report** - Raw vehicle data\n10. **Track Data Report / All Parameters** - Complete tracking parameters\n11. **Over Speeding Report** - Speed violations and incidents\n12. **Driver Behavior Report** - Driver performance and behavior analysis\n13. **Temperature & Humidity Report** - Environmental sensor data\n14. **Weight Sensor Report** - Weight sensor readings\n15. **Commands History Report** - Command execution history\n16. **Events Report** - Vehicle events and incidents\n\nJust tell me which report you need, along with the vehicle plate number(s) and date range!"

  utter_ask_report_form_assets:
  - text: "What vehicle plate numbers should I use?"

  utter_ask_report_form_date_range:
  - text: "What date range should I use? You can provide one date or a start and end date. Supported formats: DD-MM-YYYY (e.g., 05-01-2025), DD.MM.YYYY (e.g., 05.01.2025), DD/MM/YYYY (e.g., 05/01/2025), or natural language (e.g., '2 june 2025', 'june 2, 2025')."

  utter_ask_report_form_driver:
  - text: "Please provide a driver name for the driver behavior report."

forms:
  report_form:
    required_slots:
      - report_type
      - driver
      - assets
      - date_range

actions:
  - validate_report_form
  - action_run_report
  - action_handle_textual_fleet
  - action_prompt_report_type

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: True
